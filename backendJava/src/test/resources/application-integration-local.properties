spring.application.name=dn-store-backend-integration-local
spring.datasource.url=jdbc:mysql://127.0.0.1:33316/dn_store_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=dn_store_it
spring.datasource.password=only-local-test-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.uuid.binary=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR
spring.jpa.show-sql=false
jwt.secret=integration-local-only-not-a-real-credential-0123456789abcdef
jwt.expiration=60000
auth.challenge-secret=integration-local-only-not-a-real-secret
resend.api-key=
resend.from=DN Store Integration <local@example.invalid>
app.frontend-url=http://127.0.0.1:3000
cors.allowed-origins=http://127.0.0.1:3000
shipping.origin-zip=
shipping.gateway=simulated
shipping.http.connect-timeout=PT3S
shipping.http.read-timeout=PT10S
shipping.cleanup-interval-ms=3600000
payment.gateway.active=asaas
asaas.environment=sandbox
asaas.api-key=
asaas.base-url=https://api-sandbox.asaas.com/v3
asaas.webhook-token=
asaas.user-agent=DN-Store Integration/1.0
asaas.connect-timeout=PT1S
asaas.read-timeout=PT1S
payment.order-expiration-minutes=60
payment.expiration-scan-ms=86400000
melhor-envio.environment=sandbox
melhor-envio.client-id=
melhor-envio.client-secret=
melhor-envio.redirect-uri=http://127.0.0.1:3000/integration-callback
melhor-envio.api-base-url=https://sandbox.melhorenvio.com.br
melhor-envio.authorization-url=https://sandbox.melhorenvio.com.br/oauth/authorize
melhor-envio.token-url=https://sandbox.melhorenvio.com.br/oauth/token
melhor-envio.scopes=shipping-calculate
melhor-envio.user-agent=DN Store Integration (local@example.invalid)
melhor-envio.token-encryption-key=
melhor-envio.state-ttl=PT10M
melhor-envio.quote-ttl=PT15M
melhor-envio.refresh-skew=PT5M
melhor-envio.refresh-token-ttl=PT720H
