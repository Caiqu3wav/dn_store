spring.application.name=dn-store-backend-integration-local
spring.datasource.url=jdbc:mysql://127.0.0.1:33316/dn_store_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=dn_store_it
spring.datasource.password=only-local-test-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.uuid.binary=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR
spring.jpa.show-sql=false
jwt.secret=integration-local-only-not-a-real-credential-0123456789abcdef
jwt.expiration=60000
auth.challenge-secret=integration-local-only-not-a-real-secret
resend.api-key=
resend.from=DN Store Integration <local@example.invalid>
app.frontend-url=http://127.0.0.1:3000
cors.allowed-origins=http://127.0.0.1:3000
shipping.origin-zip=
shipping.gateway=simulated
payment.gateway.active=asaas
asaas.api-key=
asaas.base-url=http://127.0.0.1:1
asaas.webhook-token=
payment.order-expiration-minutes=60
payment.expiration-scan-ms=86400000
melhor-envio.client-id=
melhor-envio.client-secret=
melhor-envio.redirect-uri=http://127.0.0.1:3000/integration-callback
melhor-envio.base-url=http://127.0.0.1:1
