server.port=8080

# Loads local environment values when running from the backend directory.
spring.config.import=optional:file:.env[.properties]

spring.application.name=dn-store-backend

logging.level.com.dnstore.backend=DEBUG

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Database ────────────────────────────────────────────────────────────────
# Aiven: DB_URL=jdbc:mysql://<host>:<port>/<database>?ssl-mode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Use 'validate' em produção. Use 'update' apenas ao inicializar um novo banco.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.uuid.binary=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────────────────
# DEV: fallback usado apenas localmente. Em produção, JWT_SECRET deve ser setado.
jwt.secret=${JWT_SECRET:c2VjcmV0LWRldi1kbi1zdG9yZS1jaGF2ZS1sb2NhbC0yMDI1}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Payment Gateway ──────────────────────────────────────────────────────────
payment.gateway.active=${PAYMENT_GATEWAY:asaas}
asaas.api-key=${ASAAS_API_KEY:sandbox-key-not-set}
asaas.sandbox=${ASAAS_SANDBOX:true}