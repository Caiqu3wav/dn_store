server.port=8080

# Loads local environment values when running from the backend directory.
spring.config.import=optional:file:.env[.properties]

spring.application.name=dn-store-backend

logging.level.com.dnstore.backend=DEBUG

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ── Database ────────────────────────────────────────────────────────────────
# Aiven: DB_URL=jdbc:mysql://<host>:<port>/<database>?ssl-mode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Use 'validate' em produção. Use 'update' apenas ao inicializar um novo banco.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.uuid.binary=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Email authentication ────────────────────────────────────────────────────
auth.challenge-secret=${AUTH_CHALLENGE_SECRET}
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:DN Store <onboarding@resend.dev>}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Shipping origin is required before a provider gateway can quote.
shipping.origin-zip=${ORIGIN_ZIP_CODE:${SHIPPING_ORIGIN_ZIP:}}
shipping.gateway=${SHIPPING_GATEWAY:simulated}
# Provider clients fail closed when selected but incompletely configured.
shipping.http.connect-timeout=${SHIPPING_HTTP_CONNECT_TIMEOUT:PT3S}
shipping.http.read-timeout=${SHIPPING_HTTP_READ_TIMEOUT:PT10S}
shipping.cleanup-interval-ms=${SHIPPING_CLEANUP_INTERVAL_MS:3600000}

# Melhor Envio OAuth and API URLs are supplied for the selected environment.
melhor-envio.environment=${MELHOR_ENVIO_ENV:sandbox}
melhor-envio.client-id=${MELHOR_ENVIO_CLIENT_ID:}
melhor-envio.client-secret=${MELHOR_ENVIO_CLIENT_SECRET:}
melhor-envio.redirect-uri=${MELHOR_ENVIO_REDIRECT_URI:}
melhor-envio.api-base-url=${MELHOR_ENVIO_API_BASE_URL:}
melhor-envio.authorization-url=${MELHOR_ENVIO_AUTHORIZATION_URL:}
melhor-envio.token-url=${MELHOR_ENVIO_TOKEN_URL:}
melhor-envio.scopes=${MELHOR_ENVIO_SCOPES:}
melhor-envio.user-agent=${MELHOR_ENVIO_USER_AGENT:}
melhor-envio.token-encryption-key=${MELHOR_ENVIO_TOKEN_ENCRYPTION_KEY:}
melhor-envio.state-ttl=${MELHOR_ENVIO_STATE_TTL:PT10M}
melhor-envio.quote-ttl=${SHIPPING_QUOTE_TTL:PT15M}
melhor-envio.refresh-skew=${MELHOR_ENVIO_REFRESH_SKEW:PT5M}
melhor-envio.refresh-token-ttl=${MELHOR_ENVIO_REFRESH_TOKEN_TTL:PT720H}

# ── Payment Gateway ──────────────────────────────────────────────────────────
payment.gateway.active=${PAYMENT_GATEWAY:asaas}
asaas.api-key=${ASAAS_API_KEY:}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
payment.order-expiration-minutes=${PAYMENT_ORDER_EXPIRATION_MINUTES:60}
payment.expiration-scan-ms=${PAYMENT_EXPIRATION_SCAN_MS:60000}
