server.port=8080

spring.application.name=dn-store-backend

logging.level.com.dnstore.backend=DEBUG

cors.allowed-origins=*

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/app_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:app_user}
spring.datasource.password=${DB_PASS:app_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.uuid.binary=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:sUsCUX0i9eYOYbj0aan1bVo9LxWpQRTrCxq+XRTPQrM=}
jwt.expiration=${JWT_EXPIRATION:86400000}