# Perfil de produção (SPRING_PROFILES_ACTIVE=prod). Sobrepõe application.properties.
# Segredos e URLs continuam vindo de variáveis de ambiente; nada sensível aqui.

# ── Logs ────────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.dnstore.backend=INFO
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Banco ───────────────────────────────────────────────────────────────────
# O schema é gerenciado apenas pelo Flyway. Em produção o Hibernate só valida,
# mesmo que DDL_AUTO esteja definido no ambiente.
spring.jpa.hibernate.ddl-auto=validate
# Respeite o limite de conexões do plano do banco (Aiven Developer/Hobbyist são pequenos).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1740000

# ── Proxy reverso / HTTPS ───────────────────────────────────────────────────
# A plataforma termina o TLS e repassa X-Forwarded-*; sem isso o app enxerga http e o IP do
# proxy (os logs de segurança do JWT registram o IP). O modo "native" (Tomcat) só confia nesses
# headers quando vêm de proxies de rede interna, então um cliente externo não consegue forjá-los.
server.forward-headers-strategy=native

# ── Encerramento e erros ────────────────────────────────────────────────────
# Termina requisições em andamento (ex.: webhook sendo gravado) antes de parar.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
