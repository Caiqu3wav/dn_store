# Perfil "readonly": inspeção visual do app contra um banco REAL (por exemplo o Aiven) sem escrever nele.
# Uso: SPRING_PROFILES_ACTIVE=local,readonly ./mvnw spring-boot:run   (em backendJava/, com o .env habitual)
#
# Camadas de proteção:
#  1. Sem Flyway: não aplica migrations. Com ddl-auto=validate o app apenas confere o schema existente.
#  2. @Profile("!readonly") desliga o DatabaseSeeder e os agendadores que escrevem
#     (expiração de pedidos, worker de webhooks, limpeza de cotações).
#  3. Toda conexão do pool abre em sessão MySQL somente leitura; escritas são recusadas pelo servidor.
# Efeito colateral esperado: login, cadastro, carrinho e checkout não funcionam (precisam gravar).
# Para garantia total, o ideal ainda é um usuário do banco só com SELECT.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-init-sql=SET SESSION TRANSACTION READ ONLY
